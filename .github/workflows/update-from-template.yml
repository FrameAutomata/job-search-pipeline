name: Update from Template

# Pull the maintainer's latest changes (the upstream template) into this copy.
# Copies made via "Use this template" have no git link to the source, so this
# adds it as a remote, merges template/main, and pushes. Run it from the
# Actions tab, or use the local UI's "Update" button (which does the same
# merge+push locally and also refreshes the clone running the UI).
#
# It also runs on a weekly schedule, but ONLY when the repository variable
# AUTO_UPDATE_FROM_TEMPLATE is 'true' (the Setup wizard's "Keep my copy updated
# weekly" box sets it). Opt-in rather than default because a merge lands in the
# copy's history unasked — and what lands is code, .github/workflows included,
# which the next daily then executes with this repository's secrets — while a
# conflict fails loudly in the Actions tab; a dispatch always proceeds.
# tests/test_template_update_flag.py pins the gate.

on:
  schedule:
    - cron: '0 4 * * 1'    # Mondays 04:00 UTC, well clear of the noon daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-template
  cancel-in-progress: false

jobs:
  update:
    # Never self-update the upstream template repository; and a SCHEDULED run
    # proceeds only when the copy opted in (a dispatch always does).
    if: >-
      github.repository != 'FrameAutomata/job-search-pipeline'
      && (github.event_name == 'workflow_dispatch' || vars.AUTO_UPDATE_FROM_TEMPLATE == 'true')
    runs-on: ubuntu-latest
    # Bounded so a hang bills 30 minutes, not GitHub's 360-minute default, against
    # the account's 2,000 free Actions minutes a month.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history, so the merge sees every commit

      - name: Merge latest template main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add template https://github.com/FrameAutomata/job-search-pipeline.git
          git fetch template main
          # --allow-unrelated-histories is required, not defensive: copies are
          # made with "Use this template", which starts a fresh root commit, so
          # a copy shares no ancestor with the template and plain `git merge`
          # refuses. That is every copy's FIRST update — the case this workflow
          # exists for. After it, a shared ancestor exists and the flag no-ops.
          if git merge --no-edit --allow-unrelated-histories FETCH_HEAD; then
            git push origin HEAD
          else
            # Leave a clean tree and fail loudly — the user resolves it locally
            # (fetch the template, merge, push) rather than the bot guessing.
            git merge --abort
            echo "::error::Merge conflict with the template. Resolve it locally: add the template remote, merge template/main --allow-unrelated-histories, push."
            exit 1
          fi
