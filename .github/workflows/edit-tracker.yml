name: Edit Tracker

# Manual workflow to edit applications.md without committing it to the repo.
#
# Typical flow:
#   1. Go to Actions → Daily Job Pipeline → latest run → "pipeline-output-*"
#      artifact → download → extract applications.md
#   2. Edit the file locally (mark "Applied", "Rejected", update notes, etc.)
#   3. base64-encode it (Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("applications.md"));
#      macOS: base64 -i applications.md | tr -d '\n'; Linux: base64 -w0 applications.md). Not certutil.
#   4. Run this workflow → paste the base64 string into the input → Run
#
# The workflow writes the new applications.md into the pipeline state cache so
# the next scheduled pipeline run sees the updated statuses (and dedup against
# applications.md continues working).
#
# We accept base64 because GitHub Actions inputs don't accept multi-line text
# reliably and applications.md easily has multi-line table cells.
#
# For a tracker too LARGE for the inline base64 input (GitHub caps workflow_dispatch
# inputs at ~64KB), upload it as an asset named "applications.md" on a release and
# pass that release tag via applications_md_release_tag — the run fetches it with
# its own token, so a private tracker never leaves the private repo.

on:
  workflow_dispatch:
    inputs:
      applications_md_b64:
        description: "Full-file replacement: base64 of applications.md. Win: [Convert]::ToBase64String([IO.File]::ReadAllBytes('applications.md')) · mac: base64 -i applications.md|tr -d '\\n' · linux: base64 -w0 applications.md. Not certutil."
        required: false
        type: string
      status_overrides_json:
        description: "Status-only changes: JSON object of {\"num\": \"Status\"} pairs (e.g. {\"1\":\"Applied\",\"3\":\"SKIP\"}). Used by the UI push button — much smaller than a full-file dispatch, avoids the GitHub input size limit."
        required: false
        type: string
      applications_md_release_tag:
        description: "Full-file replacement for trackers TOO LARGE for the inline base64 input (which hits GitHub's ~64KB input limit). Upload applications.md as an asset named 'applications.md' on a release with this tag in THIS private repo, then pass the tag here. The asset is fetched with the run's token, so a private tracker stays private."
        required: false
        type: string

permissions:
  contents: read

# Don't race a scheduled pipeline run that's also saving the same cache.
concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check repo visibility and template status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_TEMPLATE=$(gh api repos/${{ github.repository }} --jq .is_template)
          VIS=$(gh api repos/${{ github.repository }} --jq .visibility)
          echo "is_template=$IS_TEMPLATE visibility=$VIS"
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "Template repository — manual runs no-op here."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VIS" != "private" ]; then
            echo "::error::This workflow only runs in PRIVATE repositories."
            exit 1
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  apply-edit:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        env:
          MD_B64: ${{ inputs.applications_md_b64 }}
          OVERRIDES: ${{ inputs.status_overrides_json }}
          RELEASE_TAG: ${{ inputs.applications_md_release_tag }}
        run: |
          if [ -z "$MD_B64" ] && [ -z "$OVERRIDES" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::Provide one of: applications_md_b64 (inline full-file), applications_md_release_tag (large full-file via release asset), or status_overrides_json (status-only changes)."
            exit 1
          fi
          if [ -n "$MD_B64" ] && [ -n "$RELEASE_TAG" ]; then
            echo "::error::Provide only one full-file source — applications_md_b64 OR applications_md_release_tag, not both."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      # This path list MUST stay byte-for-byte identical to daily-pipeline.yml's
      # cache path list. GitHub derives the cache "version" from the path set, and
      # restore-keys only matches same-version caches — if the two lists drift, a
      # tracker installed here lands in a cache the daily can never restore (it
      # silently builds its own lineage instead). That exact drift once dropped
      # recheck-state.tsv + easy-apply-urls.txt here and broke every push.
      - name: Restore pipeline state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/data/recheck-state.tsv
            career-ops/data/easy-apply-urls.txt
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      - name: Fetch full applications.md from release asset
        if: inputs.applications_md_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.applications_md_release_tag }}
        run: |
          mkdir -p career-ops/data
          # Token-authed download keeps a private tracker private. The asset must
          # be named exactly "applications.md" on the given release/tag.
          if ! gh release download "$RELEASE_TAG" -R "${{ github.repository }}" \
               -p applications.md -O career-ops/data/applications.md.new --clobber; then
            echo "::error::Could not download an 'applications.md' asset from release tag '$RELEASE_TAG'. Create it with: gh release create $RELEASE_TAG -R ${{ github.repository }} applications.md"
            exit 1
          fi

          # Same smell check as the inline path: must be the tracker, not a stray file.
          if ! head -n 1 career-ops/data/applications.md.new | grep -q "Applications Tracker"; then
            echo "::error::Downloaded asset does not start with '# Applications Tracker' — refusing to overwrite."
            head -n 3 career-ops/data/applications.md.new
            exit 1
          fi

          mv career-ops/data/applications.md.new career-ops/data/applications.md
          echo "Installed applications.md from release asset '$RELEASE_TAG':"
          wc -l career-ops/data/applications.md
          head -n 5 career-ops/data/applications.md

      - name: Decode and validate new applications.md
        if: inputs.applications_md_b64 != ''
        env:
          APPLICATIONS_MD_B64: ${{ inputs.applications_md_b64 }}
        run: |
          mkdir -p career-ops/data
          # Decode to file, tolerating PEM wrappers (Windows certutil -encode) and
          # CRLF/whitespace so a Windows-encoded paste doesn't abort with a cryptic
          # "invalid input". Name the failure if it's genuinely not base64.
          if ! printf '%s' "$APPLICATIONS_MD_B64" \
               | sed 's/-----[A-Za-z ]*-----//g' \
               | tr -d '[:space:]' \
               | base64 -d > career-ops/data/applications.md.new 2>/dev/null; then
            echo "::error::applications_md_b64 is not valid base64. Re-encode — on Windows use [Convert]::ToBase64String([IO.File]::ReadAllBytes('applications.md')), NOT certutil."
            exit 1
          fi

          # Smell check: must start with the tracker header. Refuses to overwrite
          # if the input doesn't look like applications.md — protects against
          # accidentally pasting the wrong file.
          if ! head -n 1 career-ops/data/applications.md.new | grep -q "Applications Tracker"; then
            echo "::error::Decoded file does not start with '# Applications Tracker' — refusing to overwrite. Did you paste the wrong file?"
            head -n 3 career-ops/data/applications.md.new
            exit 1
          fi

          # Atomic swap.
          mv career-ops/data/applications.md.new career-ops/data/applications.md

          echo "New applications.md installed:"
          wc -l career-ops/data/applications.md
          head -n 5 career-ops/data/applications.md

      - name: Apply status overrides
        if: inputs.status_overrides_json != ''
        env:
          STATUS_OVERRIDES_JSON: ${{ inputs.status_overrides_json }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          overrides = json.loads(os.environ['STATUS_OVERRIDES_JSON'])
          path = 'career-ops/data/applications.md'
          if not os.path.exists(path):
              print('::error::applications.md not found in the pipeline state cache.')
              print('::error::Run the pipeline at least once before pushing status changes.')
              sys.exit(1)
          with open(path) as f:
              text = f.read()
          for num, status in overrides.items():
              want = str(num).strip()
              out_lines = []
              changed = False
              for line in text.splitlines():
                  if not changed and line.lstrip().startswith('|'):
                      parts = line.split('|')
                      cells = [p.strip() for p in parts]
                      if len(parts) >= 10 and cells[1] == want and cells[1] not in ('#', ''):
                          parts[6] = ' ' + status + ' '
                          line = '|'.join(parts)
                          changed = True
                  out_lines.append(line)
              result = '\n'.join(out_lines)
              if text.endswith('\n') and not result.endswith('\n'):
                  result += '\n'
              text = result
          with open(path, 'w') as f:
              f.write(text)
          print(f'Applied {len(overrides)} status override(s) to {path}')
          PYEOF

      - name: Save pipeline state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/data/recheck-state.tsv
            career-ops/data/easy-apply-urls.txt
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}

      - name: Upload new applications.md as artifact (verification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applications-md-${{ github.run_id }}
          path: career-ops/data/applications.md
          if-no-files-found: error
          # A verification copy of the file just installed — useful for a few
          # days, not a month. See the retention note in daily-pipeline.yml.
          retention-days: 7
