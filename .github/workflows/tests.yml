name: Tests

on:
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent. On a PRIVATE repo it bills at 10x
        # (Windows 2x, Linux 1x), so on a ~2.2 min run it was 21.6 of the 28
        # billable minutes each PR cost — 77% of the spend on the platform least
        # likely to break. Every macOS-specific branch we have is already covered
        # on any host by monkeypatching sys.platform (skills.py's Terminal.app
        # launcher, notify.py's osascript), so what a macOS runner adds over
        # Linux is only the environmental difference: a case-insensitive
        # filesystem and BSD rather than GNU userland. Windows stays — it is the
        # genuinely divergent platform here (path semantics, no fork) and costs
        # a fifth as much.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install UI dependencies
        run: pip install -r requirements-ui.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
