name: Seed Reports Cache

# Manual one-shot to backfill `career-ops/reports` in the pipeline state cache
# from past `pipeline-output-*` artifacts. Run it if reports exist only in
# artifacts and never made it into the cache — the cache is what every later
# run restores from, so a report missing there is missing from the pipeline's
# view of its own history.
#
# Triggers no scrape/evaluate/LLM work. Pure data move: list past successful
# pipeline runs, download each one's `pipeline-output-*` artifact, copy any
# `*.md` files under `reports/` into the cached `career-ops/reports/`, save.
#
# What this can recover shrank on purpose (issue #129). Each artifact used to
# carry the whole report history, so ONE of them re-seeded everything; now each
# carries only the reports its own run minted, and retention keeps a week of
# them. The union of the live artifacts is therefore about a week of reports,
# not all of it. That is the trade that stops artifact storage growing without
# bound, and it costs nothing that matters: the cache is the durable cloud copy
# and your local `career-ops/` is the durable local one — this workflow is for
# repairing the cache, not for being the backup.
#
# WARNING — concurrency:
#   This writes to the same `pipeline-state-v1-*` cache that the scheduled
#   pipelines use. The save step here doesn't know about evaluations that a
#   daily / easy-apply run completed in parallel, so triggering it while
#   another pipeline run is in flight can cause its updates to be overwritten.
#   Wait until the Actions tab shows no running pipeline before clicking
#   "Run workflow". The concurrency group below serializes against
#   edit-tracker but NOT against daily/easy-apply (they use different groups).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check repo visibility and template status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_TEMPLATE=$(gh api repos/${{ github.repository }} --jq .is_template)
          VIS=$(gh api repos/${{ github.repository }} --jq .visibility)
          echo "is_template=$IS_TEMPLATE visibility=$VIS"
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "Template repository — manual runs no-op here."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VIS" != "private" ]; then
            echo "::error::This workflow only runs in PRIVATE repositories."
            exit 1
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  seed:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore pipeline state cache
        uses: actions/cache/restore@v6
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      - name: Backfill reports from past pipeline-output artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p career-ops/reports
          before=$(find career-ops/reports -maxdepth 1 -name '*.md' 2>/dev/null | wc -l)
          echo "starting report count: $before"

          # Collect successful run IDs from the daily pipeline (the only
          # workflow that produces artifacts). 100 runs comfortably covers the
          # 90-day artifact retention window; gh run download silently skips
          # runs whose artifacts have expired.
          gh run list --workflow daily-pipeline.yml --status success --limit 100 \
            --json databaseId --jq '.[].databaseId' > runs.txt || true
          echo "candidate runs: $(wc -l < runs.txt)"

          mkdir -p artifacts
          ok=0; skipped=0
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            rm -rf "artifacts/$run_id"
            if gh run download "$run_id" --pattern 'pipeline-output-*' \
                 --dir "artifacts/$run_id" >/dev/null 2>&1; then
              # `cp -n` = no-clobber. If the cache already has a report file
              # of the same name, the cached version wins. Backfill only fills
              # gaps, never overwrites fresher data.
              find "artifacts/$run_id" -path '*/reports/*.md' \
                   -exec cp -n {} career-ops/reports/ \;
              ok=$((ok + 1))
            else
              skipped=$((skipped + 1))
            fi
            rm -rf "artifacts/$run_id"
          done < runs.txt

          after=$(find career-ops/reports -maxdepth 1 -name '*.md' 2>/dev/null | wc -l)
          echo "merged $ok artifact(s), skipped $skipped (expired or no artifact)"
          echo "ending report count: $after (added $((after - before)))"

      - name: Save pipeline state cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}
