name: Daily Job Pipeline

# Runs EVERY configured search pass (including any "easy apply" pass) once a day.
#
# PRIVACY MODEL — READ THIS:
#   Job-search activity is sensitive. Public repositories expose commit history,
#   workflow run history, schedule cadence, and any file you commit. To keep
#   this safe for employed users:
#     1. The TEMPLATE repository (marked "Template repository" in Settings)
#        is detected and scheduled runs no-op silently there. The template
#        stays public so people can browse and copy it.
#     2. Real runs only happen in PRIVATE copies created via the "Use this
#        template" button. The workflow hard-stops if it finds itself running
#        in a public non-template repo.
#     3. All runtime state lives in GitHub Actions Cache — never committed.
#     4. Reports are uploaded as workflow Artifacts — downloadable from the
#        Actions tab, scoped to your fork.
#     5. Setup data (CV, profile) is stored as encrypted repository Secrets.
#
# Required SECRETS (Settings → Secrets and variables → Actions) — each is a file,
# base64-encoded. Easiest: the ⚙ Setup wizard encodes + writes them for you. By
# hand, encode with your OS's command (NOT Windows `certutil`, which wraps the
# output in PEM lines): Windows `[Convert]::ToBase64String([IO.File]::ReadAllBytes("FILE"))`,
# macOS `base64 -i FILE | tr -d '\n'`, Linux `base64 -w0 FILE`.
#   CV_MD_B64          — career-ops/cv.md
#   PROFILE_YML_B64    — career-ops/config/profile.yml
#   SEARCH_CONFIG_B64  — config/search.yml
#   RESUME_TXT_B64     — resumes/resume.txt
#   (optional) PROFILE_MD_B64     — your modes/_profile.md customizations
#   (optional) ARTICLE_DIGEST_B64 — your article-digest.md
#   (optional) PROFILE_MASTER_B64 — your living PROFILE.md (the browser agent's master;
#                                   when set, the cloud evaluator scores against it)
#   At least one LLM key: GEMINI_API_KEY / GROQ_API_KEY / DEEPINFRA_API_KEY /
#     OPENROUTER_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC = 7 AM CDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    # Cheap gating job. Decides whether the real work runs. Keeps the privacy
    # guards in one place instead of repeated as `if:` on every downstream step.
    #
    # Skip entirely in the upstream template repo so scheduled triggers consume
    # zero Actions minutes there. Forks/template-uses have a different
    # github.repository and proceed normally.
    if: github.repository != 'FrameAutomata/job-search-pipeline'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check repo visibility and template status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_TEMPLATE=$(gh api repos/${{ github.repository }} --jq .is_template)
          VIS=$(gh api repos/${{ github.repository }} --jq .visibility)
          echo "is_template=$IS_TEMPLATE visibility=$VIS"
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "This is the template repository — scheduled runs no-op here. Click 'Use this template' on GitHub to create your own private copy."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VIS" != "private" ]; then
            echo "::error::This workflow only runs in PRIVATE repositories. Job-search activity is sensitive; the workflow run history and commit log of a public repo would expose it. Use 'Use this template' on GitHub to create a private copy, then re-run."
            exit 1
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  scrape-and-evaluate:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai openai 2>/dev/null || true

      - name: Clone career-ops fork
        run: |
          git clone --depth 1 --branch dev/batch-local-llm \
            https://github.com/FrameAutomata/career-ops career-ops

      - name: Install career-ops Node deps
        # --ignore-scripts: career-ops' postinstall runs
        # `npx playwright install chromium --with-deps`, downloading a browser
        # and apt-installing its system libraries. The daily run only shells out
        # to merge-tracker.mjs, which needs js-yaml and nothing else — so that
        # is minutes of runner time and a sudo-dependent apt step, on every run,
        # for a browser nothing here launches. A failure in it fails the step.
        run: npm install --prefix career-ops --ignore-scripts

      - name: Decode setup secrets into place
        env:
          SEARCH_CONFIG_B64:  ${{ secrets.SEARCH_CONFIG_B64 }}
          RESUME_TXT_B64:     ${{ secrets.RESUME_TXT_B64 }}
          CV_MD_B64:          ${{ secrets.CV_MD_B64 }}
          PROFILE_YML_B64:    ${{ secrets.PROFILE_YML_B64 }}
          PROFILE_MD_B64:     ${{ secrets.PROFILE_MD_B64 }}
          ARTICLE_DIGEST_B64: ${{ secrets.ARTICLE_DIGEST_B64 }}
          PROFILE_MASTER_B64: ${{ secrets.PROFILE_MASTER_B64 }}
        run: |
          mkdir -p config resumes career-ops/config career-ops/modes career-ops/data \
                   career-ops/batch/jds career-ops/batch/tracker-additions career-ops/reports

          # Decode one base64 secret to a file, tolerantly and with a named error.
          # Tolerance: strip PEM wrapper lines (certutil -encode adds
          # `-----BEGIN CERTIFICATE-----`) and all whitespace/CRLFs before
          # decoding, so the common Windows mis-encodings don't abort the run.
          # On failure we name the offending secret instead of a generic abort.
          fail=0
          decode_secret() {  # $1=name $2=value $3=dest $4=required(yes|no)
            name="$1"; val="$2"; dest="$3"; required="$4"
            if [ -z "$val" ]; then
              if [ "$required" = yes ]; then
                echo "::error::Required secret $name is empty or unset. Add it under Settings → Secrets and variables → Actions (see README 'Configure your private copy')."
                fail=1
              fi
              return
            fi
            if ! printf '%s' "$val" \
                 | sed 's/-----[A-Za-z ]*-----//g' \
                 | tr -d '[:space:]' \
                 | base64 -d > "$dest" 2>/dev/null; then
              echo "::error::Secret $name is not valid base64. Re-encode it — on Windows use [Convert]::ToBase64String([IO.File]::ReadAllBytes('path\\to\\file')), NOT certutil. See README 'Configure your private copy'."
              fail=1
              return
            fi
            if [ ! -s "$dest" ]; then
              echo "::error::Secret $name decoded to an empty file. Re-encode it (see README)."
              fail=1
            fi
          }

          decode_secret SEARCH_CONFIG_B64  "$SEARCH_CONFIG_B64" config/search.yml             yes
          decode_secret RESUME_TXT_B64     "$RESUME_TXT_B64"    resumes/resume.txt             yes
          decode_secret CV_MD_B64          "$CV_MD_B64"         career-ops/cv.md               yes
          decode_secret PROFILE_YML_B64    "$PROFILE_YML_B64"   career-ops/config/profile.yml  yes
          decode_secret PROFILE_MD_B64     "$PROFILE_MD_B64"    career-ops/modes/_profile.md   no
          decode_secret ARTICLE_DIGEST_B64 "$ARTICLE_DIGEST_B64" career-ops/article-digest.md  no
          decode_secret PROFILE_MASTER_B64 "$PROFILE_MASTER_B64" career-ops/PROFILE.md          no

          if [ "$fail" = 1 ]; then
            echo "::error::One or more setup secrets failed to decode (see above). Fix them and re-run."
            exit 1
          fi

      # Cache holds all dynamic state. Restore the latest matching cache at the
      # start of the run; save a fresh one keyed by run_id at the end so the
      # next run picks it up via the prefix.
      - name: Restore pipeline state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/data/recheck-state.tsv
            career-ops/data/easy-apply-urls.txt
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      # Everything the restore just put on disk is HISTORY, not this run's work.
      # Record it now so the upload step below can tell the two apart. Must sit
      # between the restore and the pipeline: earlier and it misses the restored
      # reports (so they all look new), later and it misses this run's.
      - name: Snapshot the restored reports
        run: |
          python -m pipeline.run_artifact snapshot \
            --root career-ops \
            --manifest "$RUNNER_TEMP/artifact-manifest.json" \
            --delta reports

      - name: Run pipeline and evaluate
        env:
          BATCH_PROVIDER:    ${{ vars.BATCH_PROVIDER || '' }}
          BATCH_MODEL:       ${{ vars.BATCH_MODEL || '' }}
          BATCH_CONCURRENCY: ${{ vars.BATCH_CONCURRENCY || '3' }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY:  ${{ secrets.DEEPINFRA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          # OPENAI_BASE_URL is the escape hatch for any OpenAI-compatible
          # endpoint we haven't added explicitly. It's a non-sensitive URL,
          # so it lives in repository variables, not secrets.
          OPENAI_BASE_URL:    ${{ vars.OPENAI_BASE_URL || '' }}
        run: |
          # No pass-selection flag → run EVERY pass in search.yml (including any
          # easy_apply pass) in a single daily run. --recheck-liveness re-checks
          # the tracker's still-open roles once a day and Discards any whose
          # posting has since closed.
          python orchestrate.py --evaluate-batch \
            --recheck-liveness \
            --batch-concurrency "$BATCH_CONCURRENCY"

      - name: Save pipeline state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/data/recheck-state.tsv
            career-ops/data/easy-apply-urls.txt
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
            career-ops/reports
          key: pipeline-state-v1-${{ github.run_id }}

      # `career-ops/reports/` accumulates across runs (it is restored from the
      # state cache), so uploading it directly put the entire report history
      # into every daily artifact — and retention keeps several alive at once,
      # which made live storage grow with the SQUARE of how long the pipeline
      # had been running. That exhausted the account's Actions storage, and an
      # exhausted quota stops GitHub creating workflow runs at all, including
      # the Tests run on every pull request (issue #129).
      #
      # So stage what THIS RUN produced and upload that: reports absent from the
      # pre-run manifest, plus applications.md, which must ship entire because
      # the UI's Refresh MERGES it — a diff of a tracker is useless. That row
      # growth is irreducible and small (~200 bytes per evaluated role, against
      # ~4KB per report), and it is the only accumulating thing left here.
      #
      # data/pipeline.md and data/easy-apply-urls.txt used to ride along and no
      # longer do. Both are append-only, both are restored from the cache, and
      # pipeline.md carries a 500-char JD preview for EVERY bridged offer — far
      # more offers than evaluated roles — so together they reproduced the same
      # unbounded shape at a smaller constant. Nothing consumed them from the
      # artifact either: `data.sync_pulled_tracker` reads applications.md,
      # reports/ and pipeline.md, and the cloud runs --evaluate-batch, which
      # never drains pipeline.md, so its copy is a write-only log. Anything the
      # local dedup needs from a cloud run arrives in applications.md, which the
      # same run writes.
      #
      # tracker-additions is not in the cache, so it is already per-run. The
      # staged tree keeps career-ops' layout, which is what
      # `gh.download_artifact` and `data.sync_pulled_tracker` expect.
      #
      # The full history is not this artifact's job — it lives in the
      # pipeline-state cache and in the user's local career-ops/. Recovering it
      # onto a fresh machine is what .github/workflows/export-reports.yml is for.
      - name: Stage this run's output for upload
        if: always()
        run: |
          python -m pipeline.run_artifact stage \
            --root career-ops \
            --manifest "$RUNNER_TEMP/artifact-manifest.json" \
            --into "$RUNNER_TEMP/pipeline-artifact" \
            --delta reports \
            --whole data/applications.md \
            --whole batch/tracker-additions

      - name: Upload this run's reports and tracker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: ${{ runner.temp }}/pipeline-artifact
          if-no-files-found: ignore
          # 7, not the 90 that nobody chose. Retention bounds how MANY artifacts
          # are alive, never how big each one is — see the staging step above for
          # the half that bounds the size. A week is plenty for what this is: the
          # delivery mechanism for a DAILY job (README — "download the
          # pipeline-output-* artifact"). tests/test_workflow_artifacts.py keeps
          # every upload step in this repo under the ceiling.
          retention-days: 7
