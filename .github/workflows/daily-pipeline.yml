name: Daily Job Pipeline

# Scrape -> filter -> screen -> bridge -> batch-prep -> evaluate
#
# Provider is auto-detected from the first API key secret found (checked in order:
# GEMINI_API_KEY, GROQ_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY).
# Override with the BATCH_PROVIDER repository variable.
#
# Required secrets (set at least one API key):
#   SEARCH_CONFIG_B64  — base64-encoded config/search.yml
#   RESUME_TXT_B64     — base64-encoded resumes/resume.txt  (run setup to generate)
#   GEMINI_API_KEY     — Google Gemini (free tier, recommended)
#   GROQ_API_KEY       — Groq (free tier, fast open-source models)
#   OPENAI_API_KEY     — OpenAI
#   ANTHROPIC_API_KEY  — Anthropic (also enables --submit-batch async path)
#
# Required: career-ops-data/ directory committed to this repo (see CLAUDE.md)

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC = 7 AM CDT
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install provider SDK(s) for whichever key is configured
          pip install google-generativeai openai 2>/dev/null || true

      - name: Clone career-ops fork
        run: |
          git clone --depth 1 --branch dev/batch-local-llm \
            https://github.com/FrameAutomata/career-ops career-ops

      - name: Install career-ops Node deps
        run: npm install --prefix career-ops

      - name: Decode secrets into place
        env:
          SEARCH_CONFIG_B64: ${{ secrets.SEARCH_CONFIG_B64 }}
          RESUME_TXT_B64: ${{ secrets.RESUME_TXT_B64 }}
        run: |
          mkdir -p config resumes
          echo "$SEARCH_CONFIG_B64" | base64 -d > config/search.yml
          echo "$RESUME_TXT_B64"   | base64 -d > resumes/resume.txt

      - name: Restore career-ops user data
        run: |
          if [ -d career-ops-data ]; then
            mkdir -p career-ops/data career-ops/batch/jds career-ops/batch/tracker-additions \
                     career-ops/reports career-ops/config career-ops/modes
            if [ -f career-ops-data/cv.md ];                     then cp career-ops-data/cv.md career-ops/; fi
            if [ -f career-ops-data/article-digest.md ];          then cp career-ops-data/article-digest.md career-ops/; fi
            if [ -f career-ops-data/config/profile.yml ];         then cp career-ops-data/config/profile.yml career-ops/config/; fi
            if [ -f career-ops-data/modes/_profile.md ];          then cp career-ops-data/modes/_profile.md career-ops/modes/; fi
            if [ -f career-ops-data/data/applications.md ];       then cp career-ops-data/data/applications.md career-ops/data/; fi
            if [ -f career-ops-data/data/scan-history.tsv ];      then cp career-ops-data/data/scan-history.tsv career-ops/data/; fi
            if [ -f career-ops-data/data/pipeline.md ];           then cp career-ops-data/data/pipeline.md career-ops/data/; fi
            if [ -f career-ops-data/batch/batch-input.tsv ];      then cp career-ops-data/batch/batch-input.tsv career-ops/batch/; fi
            if [ -f career-ops-data/batch/batch-api-state.json ]; then cp career-ops-data/batch/batch-api-state.json career-ops/batch/; fi
            if [ -d career-ops-data/reports ];                    then cp -r career-ops-data/reports/. career-ops/reports/; fi
            if [ -d career-ops-data/batch/tracker-additions ];    then cp -r career-ops-data/batch/tracker-additions/. career-ops/batch/tracker-additions/; fi
          else
            echo "WARNING: career-ops-data/ not found — see CLAUDE.md for setup instructions"
          fi

      - name: Run pipeline and evaluate
        env:
          BATCH_PROVIDER:    ${{ vars.BATCH_PROVIDER || '' }}
          BATCH_MODEL:       ${{ vars.BATCH_MODEL || '' }}
          BATCH_CONCURRENCY: ${{ vars.BATCH_CONCURRENCY || '3' }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python orchestrate.py --evaluate-batch \
            --batch-concurrency "$BATCH_CONCURRENCY"

      - name: Save career-ops output data
        run: |
          mkdir -p career-ops-data/data career-ops-data/batch/tracker-additions career-ops-data/reports
          if [ -f career-ops/data/scan-history.tsv ];     then cp career-ops/data/scan-history.tsv career-ops-data/data/; fi
          if [ -f career-ops/data/applications.md ];       then cp career-ops/data/applications.md career-ops-data/data/; fi
          if [ -f career-ops/data/pipeline.md ];           then cp career-ops/data/pipeline.md career-ops-data/data/; fi
          if [ -f career-ops/batch/batch-input.tsv ];      then cp career-ops/batch/batch-input.tsv career-ops-data/batch/; fi
          if [ -f career-ops/batch/batch-api-state.json ]; then cp career-ops/batch/batch-api-state.json career-ops-data/batch/; fi
          if [ -d career-ops/batch/tracker-additions ];    then cp -r career-ops/batch/tracker-additions/. career-ops-data/batch/tracker-additions/; fi
          if [ -d career-ops/reports ];                    then cp -r career-ops/reports/. career-ops-data/reports/; fi

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add career-ops-data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(git diff --staged --name-only | grep 'reports/' | wc -l | tr -d ' ')
            git commit -m "chore: daily pipeline — ${COUNT} evaluation(s) $(date -u +%Y-%m-%d)"
            git push
          fi
