name: Easy Apply Job Pipeline

# Runs the "easy apply" pass every 4 hours. Easy-apply listings churn fast
# (fill in hours) so we re-scrape often and rely on screen-stage dedup
# against the cached scan-history so each run only evaluates genuinely
# new + live postings.
#
# Schedule offset (02/06/10/14/18/22 UTC) avoids overlap with the 12:00
# daily-pipeline run.
#
# See daily-pipeline.yml for the full privacy model and secrets list.
# This workflow refuses to run in a public repository.

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-apply-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check repo visibility and template status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_TEMPLATE=$(gh api repos/${{ github.repository }} --jq .is_template)
          VIS=$(gh api repos/${{ github.repository }} --jq .visibility)
          echo "is_template=$IS_TEMPLATE visibility=$VIS"
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "Template repository — scheduled runs no-op here."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VIS" != "private" ]; then
            echo "::error::This workflow only runs in PRIVATE repositories. Use 'Use this template' on GitHub to create a private copy, then re-run."
            exit 1
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  scrape-and-evaluate:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai openai 2>/dev/null || true

      - name: Clone career-ops fork
        run: |
          git clone --depth 1 --branch dev/batch-local-llm \
            https://github.com/FrameAutomata/career-ops career-ops

      - name: Install career-ops Node deps
        run: npm install --prefix career-ops

      - name: Decode setup secrets into place
        env:
          SEARCH_CONFIG_B64:  ${{ secrets.SEARCH_CONFIG_B64 }}
          RESUME_TXT_B64:     ${{ secrets.RESUME_TXT_B64 }}
          CV_MD_B64:          ${{ secrets.CV_MD_B64 }}
          PROFILE_YML_B64:    ${{ secrets.PROFILE_YML_B64 }}
          PROFILE_MD_B64:     ${{ secrets.PROFILE_MD_B64 }}
          ARTICLE_DIGEST_B64: ${{ secrets.ARTICLE_DIGEST_B64 }}
        run: |
          mkdir -p config resumes career-ops/config career-ops/modes career-ops/data \
                   career-ops/batch/jds career-ops/batch/tracker-additions career-ops/reports
          echo "$SEARCH_CONFIG_B64" | base64 -d > config/search.yml
          echo "$RESUME_TXT_B64"    | base64 -d > resumes/resume.txt
          echo "$CV_MD_B64"         | base64 -d > career-ops/cv.md
          echo "$PROFILE_YML_B64"   | base64 -d > career-ops/config/profile.yml
          if [ -n "$PROFILE_MD_B64" ]; then
            echo "$PROFILE_MD_B64"     | base64 -d > career-ops/modes/_profile.md
          fi
          if [ -n "$ARTICLE_DIGEST_B64" ]; then
            echo "$ARTICLE_DIGEST_B64" | base64 -d > career-ops/article-digest.md
          fi

      - name: Restore pipeline state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      - name: Run pipeline and evaluate
        env:
          BATCH_PROVIDER:    ${{ vars.BATCH_PROVIDER || '' }}
          BATCH_MODEL:       ${{ vars.BATCH_MODEL || '' }}
          BATCH_CONCURRENCY: ${{ vars.BATCH_CONCURRENCY || '3' }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY:  ${{ secrets.DEEPINFRA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL:    ${{ vars.OPENAI_BASE_URL || '' }}
        run: |
          # --easy-apply-only selects every pass in search.yml whose JobSpy
          # easy_apply field is true. Routes by config field (not pass name)
          # so user-defined pass names work without editing this YAML. If the
          # user has no easy_apply passes configured, this is a clean no-op.
          python -u orchestrate.py --evaluate-batch \
            --easy-apply-only \
            --batch-concurrency "$BATCH_CONCURRENCY"

      - name: Save pipeline state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            career-ops/data/scan-history.tsv
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/batch/batch-input.tsv
            career-ops/batch/batch-api-state.json
            career-ops/batch/jds
          key: pipeline-state-v1-${{ github.run_id }}

      - name: Upload reports and tracker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            career-ops/reports/
            career-ops/data/applications.md
            career-ops/data/pipeline.md
            career-ops/batch/tracker-additions/
          if-no-files-found: ignore
          retention-days: 90
