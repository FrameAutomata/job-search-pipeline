# Copied to ./config/search.yml by setup. Edit that file, not this one.
# Reference: https://github.com/speedyapply/JobSpy
#
# ── Multi-pass scraping ───────────────────────────────────────────────────────
# `searches` is a list of independent search passes. Each pass is scraped in
# full, then all results are merged and deduped by job_url before writing
# output/jobs.csv. Use multiple passes to work around Indeed/LinkedIn
# group-exclusivity constraints (see below).
#
# Single-pass shorthand (backwards-compatible):
#   search:          ← singular key, same fields, no `name` required
#     search_terms: [...]
#     ...

searches:

  # ── Pass 1: recent local ────────────────────────────────────────────────────
  - name: "recent local"   # label shown in [scrape] log output

    # ── Required ───────────────────────────────────────────────────────────────

    # One or more terms to search. Each term is scraped independently within
    # this pass; results are merged + deduped across all passes at the end.
    search_terms:
      - "registered nurse"
      # - "marketing coordinator"
      # - "software engineer"

    # Boards to scrape. Options: indeed, linkedin — the only two the pipeline
    # supports. The other JobSpy boards are stripped at load time with a
    # warning: Glassdoor and ZipRecruiter sit behind a Cloudflare wall that
    # 403s every scripted request (they contribute zero rows), and Google Jobs
    # serves degraded responses then drops the connection mid-body, which
    # crashes JobSpy's Google scraper and kills the whole run.
    # Default (if omitted): indeed + linkedin. Note this is a real default, not
    # "unset" — an omitted `sites` counts as naming Indeed, so the Indeed
    # mutex below (hours_old vs job_type/is_remote vs easy_apply) applies.
    sites:
      - indeed
      - linkedin

    # Number of results to retrieve *per site per search term*.
    results_wanted: 50

    # ── Location ───────────────────────────────────────────────────────────────

    location: "Toronto, ON"

    # Country filter for Indeed.
    # See JobSpy docs for the full country list.
    country_indeed: "Canada"

    # Search radius in miles. Default: 50.
    # distance: 50

    # ── Job type & remote ──────────────────────────────────────────────────────
    # ⚠ INDEED LIMITATION: only ONE of the following groups may be set per pass:
    #   Group A — hours_old
    #   Group B — job_type and/or is_remote
    #   Group C — easy_apply
    # Use separate passes (see Pass 2 / Pass 3 below) for the other groups.
    #
    # ⚠ LINKEDIN LIMITATION: only ONE of the following may be set per pass:
    #   hours_old  OR  easy_apply
    #
    # A pass that breaks either rule is SKIPPED with a warning at scrape time
    # (the rest of the run continues) — so a conflict costs you that search
    # silently unless you read the log. The UI's local-config editor refuses to
    # save one at all.
    #
    # An option counts as SET only when its value is truthy, matching what
    # JobSpy does with it: `easy_apply: false` and `hours_old: 0` send no
    # filter, so they don't activate their group and don't conflict with
    # anything. Commenting the line out says the same thing more plainly.

    # Options: fulltime, parttime, internship, contract
    # job_type: fulltime

    # true = remote only. JobSpy has no in-person filter, so `false` is the
    # same as omitting the line — both return remote and on-site alike.
    # is_remote: true

    # Filter to jobs with one-click apply (hosted on the board). Uncommenting
    # this here conflicts with hours_old below — see Pass 3 for the split.
    # Note: LinkedIn easy apply filter no longer works.
    # easy_apply: true

    # How old job postings can be (hours). Mutually exclusive with
    # job_type/is_remote and easy_apply on Indeed; mutually exclusive with
    # easy_apply on LinkedIn (see above).
    hours_old: 168  # past week

    # ── LinkedIn-specific ──────────────────────────────────────────────────────

    # Fetch full description + direct URL for LinkedIn results.
    # KEEP THIS FALSE: setting it to true makes JobSpy fetch each LinkedIn JD
    # individually during scrape — a sequential per-job HTTP request that
    # easily takes 30+ minutes on 1000 results. The screen stage backfills
    # missing descriptions from the same HTTP response it uses for the
    # liveness check (site-specific selectors + <body> fallback), so we only
    # pay ~dozens of fetches per run instead of thousands.
    linkedin_fetch_description: false

    # Restrict LinkedIn results to specific company IDs (list of ints).
    # linkedin_company_ids:
    #   - 1441

    # ── Advanced ───────────────────────────────────────────────────────────────

    # Pagination start offset (e.g. 25 starts from the 25th result).
    # offset: 0

    # Description format. Options: markdown, html. Default: markdown.
    # description_format: markdown

    # Convert wages to annual salary where possible.
    # enforce_annual_salary: false

    # Override the default User-Agent (may be outdated in older JobSpy versions).
    # user_agent: "Mozilla/5.0 ..."

    # Proxy list. Each entry: "user:pass@host:port" or "localhost".
    # Scrapers round-robin through the list.
    # proxies:
    #   - "user:pass@proxy.example.com:8080"

    # Path to a CA certificate file (for proxies that require it).
    # ca_cert: "/path/to/ca.crt"

    # Verbosity: 0 = errors only, 1 = errors + warnings, 2 = all (default: 2).
    # verbose: 1


  # ── Pass 2: remote US ───────────────────────────────────────────────────────
  # Separate pass required because is_remote (Group B) and hours_old (Group A)
  # are mutually exclusive on Indeed.
  - name: "remote US"
    search_terms:
      - "registered nurse"
    sites:
      - indeed
      - linkedin
    location: "United States"
    country_indeed: "USA"
    results_wanted: 50
    is_remote: true


  # ── Pass 3: easy apply ──────────────────────────────────────────────────────
  # Separate pass required because easy_apply (Group C) is mutually exclusive
  # with hours_old (Group A) and is_remote (Group B) on Indeed, and mutually
  # exclusive with hours_old on LinkedIn.
  # Note: LinkedIn's easy_apply filter no longer works on their end.
  - name: "easy apply"
    search_terms:
      - "registered nurse"
    sites:
      - indeed
      - linkedin
    location: "Toronto, ON"
    country_indeed: "Canada"
    results_wanted: 50
    easy_apply: true


filter:
  # Drop jobs older than this many hours, measured against date_posted.
  # Useful for passes (e.g. is_remote) that can't use hours_old on the scraper
  # side due to Indeed/LinkedIn group-exclusivity constraints. Jobs with a
  # missing or unparseable date_posted are kept regardless.
  # max_age_hours: 168  # past week

  # Role titles you're actually pursuing. Strongest positive signal — a job
  # title containing any of these gets a large score bonus (+5 each match).
  # Works for any field. List 2–5 phrasings of the same role.
  target_titles:
    - "registered nurse"
    - "RN"
    # - "marketing coordinator"
    # - "software engineer"

  # Job titles to HARD-EXCLUDE. Any job whose title contains one of these is
  # dropped entirely. Matched against job title only (not description).
  negative_titles:
    - "senior"
    - "manager"
    # - "travel"

  # Optional manual weight overrides — merged on top of resume-extracted keywords.
  # Use to boost a niche term YAKE missed, or add a keyword not in your resume.
  # keyword_overrides:
  #   "epic emr": 3
  #   "BLS": 2

  # Location / work-eligibility pre-filter (all optional). A non-remote job is
  # dropped BEFORE evaluation when its location matches negative_locations, or
  # fails the eligible_locations allowlist. This is YOUR eligibility — set it the
  # same way whether you're applying at home or abroad. Remote roles bypass it.
  # All terms match on word boundaries (case-insensitive), so a short code like
  # "US" matches "Dallas, US" but not the "us" inside "Russia".
  # negative_locations:        # whole words/phrases to exclude
  #   - "India"
  #   - "Brazil"
  # eligible_locations:        # if set, a non-remote location must contain one of these
  #   - "United States"
  #   - "Canada"
  # negative_description_terms:  # drop jobs whose description contains any of these
  #   - "security clearance"     # e.g. a clearance you don't hold — works for any country's
  #   - "TS/SCI"                 #   vocabulary (UK "vetting", FR "habilitation", etc.)
  #   - "polygraph"

  # Minimum score to keep. With YAKE defaults (base weight=1, skills-section
  # boost=2, title-match=5), a score of 5 means roughly one target_titles hit
  # OR several resume-keyword matches. Raise to be pickier, lower to see more.
  min_score: 5


# ── Screening (runs after filter, before bridge) ─────────────────────────────
# HTTP liveness check + description backfill + pre-screen dedup. Enabled by
# default — turn off only if you're running locally with --skip-screen.
#
# When liveness is on, the screen stage:
#   1. Pre-screen dedup: drops URLs already in scan-history.tsv before any
#      HTTP fetch (typical hit rate ~80% on a daily cadence — biggest cost
#      saving in the pipeline).
#   2. Liveness: status code (404/410 = expired), URL error params, body
#      patterns (e.g. "position has been filled"), apply-control presence.
#      "uncertain" (content present, no apply button) is treated as live —
#      sites like LinkedIn require login to render the apply button.
#   3. Description backfill: extracts the JD from the same fetched page when
#      the row's description is empty. Lets you keep linkedin_fetch_description
#      false during scrape and pay the per-job fetch only for surviving rows.
#   4. Dead-URL recording: URLs that fail liveness get appended to
#      scan-history.tsv with status `screened-dead` so future runs skip them
#      at step (1) instead of refetching.

screen:
  liveness: true
  liveness_timeout: 8          # per-request timeout in seconds
